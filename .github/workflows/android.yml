name: Проверка Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/android-assets.mjs', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Вложить текущий сборник
        run: |
          node scripts/build.mjs
          node scripts/android-assets.mjs
      - name: Модульные проверки, lint и сборка
        run: gradle -p android --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Подготовить KVM эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Проверить автономность на Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class ru.wef2000.pesennik.OfflineTest ru.wef2000.pesennik.test/androidx.test.runner.AndroidJUnitRunner | tee android/device-tests.log
            grep -Eq 'OK \([1-9][0-9]* tests?\)' android/device-tests.log
            mkdir -p android/screenshots
            adb pull /sdcard/Android/data/ru.wef2000.pesennik/files/screenshots android/screenshots
            adb shell run-as ru.wef2000.pesennik cat shared_prefs/reader.xml > android/prefs-before.xml
            gradle -p android --no-daemon assembleDebug -PtestVersionCode=2
            adb push android/app/build/outputs/apk/debug/app-debug.apk /sdcard/Android/data/ru.wef2000.pesennik/files/update-test.apk
            adb shell am instrument -w -r -e class ru.wef2000.pesennik.ApkUpdateTest -e apkPath /sdcard/Android/data/ru.wef2000.pesennik/files/update-test.apk ru.wef2000.pesennik.test/androidx.test.runner.AndroidJUnitRunner | tee android/apk-update-test.log
            grep -Eq 'OK \([1-9][0-9]* tests?\)' android/apk-update-test.log
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as ru.wef2000.pesennik cat shared_prefs/reader.xml > android/prefs-after.xml
            cmp android/prefs-before.xml android/prefs-after.xml
            adb shell am start -n ru.wef2000.pesennik/.MainActivity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks-and-unsigned-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/
            android/screenshots/
            android/device-tests.log
            android/apk-update-test.log
